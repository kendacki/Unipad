# Unipad edge load balancer — least_conn across API replicas + edge rate limits.
# Clients talk to nginx (:8080). Upstream health uses /health (not rate-limited).

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;
  server_tokens off;

  # Client IP when behind another proxy (CDN / cloud LB)
  real_ip_header X-Forwarded-For;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.0/8;

  log_format main '$remote_addr - $request_time "$request" $status '
                  'upstream=$upstream_addr rt=$upstream_response_time';

  access_log /var/log/nginx/access.log main;

  # Edge rate zones (per client IP) — application Redis limits still apply behind this.
  limit_req_zone $binary_remote_addr zone=api_global:20m rate=50r/s;
  limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
  limit_req_zone $binary_remote_addr zone=api_mint:10m rate=10r/s;
  limit_conn_zone $binary_remote_addr zone=addr:10m;

  # Scale-out: add more `server api-N:8787` lines or docker compose --scale api=N
  # with service discovery / DNS round-robin (see docker-compose.yml).
  upstream unipad_api {
    least_conn;
    server api:8787 max_fails=3 fail_timeout=20s;
    keepalive 64;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    limit_conn addr 64;

    # LB / orchestrator probes — never rate-limited
    location = /health {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://unipad_api;
    }

    location /v1/auth/ {
      limit_req zone=api_auth burst=20 nodelay;
      limit_req_status 429;
      include /etc/nginx/proxy_params.conf;
      proxy_pass http://unipad_api;
    }

    location ~ ^/v1/collections/.*/mint {
      limit_req zone=api_mint burst=30 nodelay;
      limit_req_status 429;
      include /etc/nginx/proxy_params.conf;
      proxy_pass http://unipad_api;
    }

    location / {
      limit_req zone=api_global burst=100 nodelay;
      limit_req_status 429;
      include /etc/nginx/proxy_params.conf;
      proxy_pass http://unipad_api;
    }
  }
}
